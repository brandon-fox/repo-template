name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '53 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-links:
    uses: brandon-fox/.github/.github/workflows/links-check.yml@595a8111464a72b0d27e3e7391dcc713f002a73a # main
    with:
      targets: 'README.md CONTRIBUTING.md TEMPLATE_README.md'

  pr-size:
    if: github.event_name == 'pull_request'
    uses: brandon-fox/.github/.github/workflows/pr-size-guard.yml@093fbcf217975354790f21e30f7ce4e4061d35c2 # main
