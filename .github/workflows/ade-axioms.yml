name: ADE axioms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  axioms:
    uses: brandon-fox/.github/.github/workflows/ade-axioms.yml@595a8111464a72b0d27e3e7391dcc713f002a73a # main
