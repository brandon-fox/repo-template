name: ADE axioms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  axioms:
    name: First-ADE axiom validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: First-ADE/.github/.github/actions/ade-axioms@a69064ab297a7be00c1b42dc13e2b89c78921888 # brand/E3-S1-principles-axioms, PR #32
